services:
  inventory-api:
    build:
      context: .
    container_name: inventory-api
    restart: unless-stopped
    init: true
    env_file:
      - .env
    networks:
      - caddy
      - postgres
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.50
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  caddy:
    external: true
    name: ${CADDY_NETWORK}
  postgres:
    external: true
    name: ${POSTGRES_NETWORK}
